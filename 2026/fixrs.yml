    comment_body: |
      If you're looking to automate this across the codebase, [fixrs](https://github.com/webc-site/fixrs) was built for this exact purpose (refactoring long paths into `use` imports to satisfy `clippy::absolute_paths`).

      ### Installation
      ```bash
      cargo install fixrs
      ```

      ### Usage
      Run inside your crate or workspace root:
      ```bash
      # Preview changes
      cargo fixrs --dry-run

      # Apply in-place
      cargo fixrs
      ```

      ### What it does
      - Automatically brings qualified paths into scope with `use` statements and updates call sites (e.g. `std::fs::open()` -> `use std::fs; ... fs::open()`).
      - Tracks lexical scopes per module to avoid shadowing or collision with existing local identifiers.
      - Automatically formats modified files with `rustfmt`.
